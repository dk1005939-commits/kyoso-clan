<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creators Zone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
  <helmet>
    <style>
      html, body { margin: 0; height: 100%; }
    </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5A1F}a:hover{color:#FF8A5C}
.pg{background:#0F1115}
.bgimg{position:fixed;inset:0;z-index:-2;background:url(/_blob/9d12fb95849e76ccff35c849c6ea6bec) 50% 0%/cover no-repeat}
.bgimg::after{content:"";position:absolute;inset:0;background:rgba(15,17,21,.8)}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-28px) rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes marquee{to{transform:translateX(-50%)}}
.fl{position:absolute;animation:float 9s ease-in-out infinite}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes clap{0%,70%,100%{transform:rotate(0)}82%{transform:rotate(-16deg)}}
.sw{position:absolute;transform-origin:50% 0;animation:swing 5s ease-in-out infinite alternate}
.bk{animation:blink 1.2s steps(1) infinite}
.cl{transform-origin:8px 38px;animation:clap 3.2s ease-in-out infinite}
@media (max-width:900px){.dec{opacity:.3!important}}
.sp{position:absolute;animation:spin 24s linear infinite}
.pulse{animation:pulse 1.4s ease-in-out infinite}
.rise{animation:rise .9s ease-out both}
.marq{animation:marquee 28s linear infinite}
section>div{transition:transform .25s,border-color .25s}
section>div:hover{transform:translateY(-6px);border-color:#FF5A1F!important}
.igi{transition:transform .2s,color .2s}.igi:hover{color:#FF5A1F!important;transform:scale(1.15)}
.igb{transition:transform .2s}.igb:hover{transform:translateY(-3px)}
@supports (animation-timeline:view()){
@keyframes reveal{from{opacity:0;transform:translateY(70px) scale(.95)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
@keyframes heroOut{to{opacity:.1;transform:translateY(-60px)}}
@keyframes par{to{translate:0 160px}}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
section>div,#join>*{animation:reveal linear backwards;animation-timeline:view();animation-range:entry 0% entry 70%}
section>div:nth-child(2){animation-range:entry 10% entry 80%}
section>div:nth-child(3){animation-range:entry 20% entry 90%}
#creators{animation-name:slideL}
#business{animation-name:slideR}
header{animation:heroOut linear both;animation-timeline:view();animation-range:exit 0% exit 90%}
.lay{animation:par linear both;animation-timeline:scroll(root)}
@keyframes bgz{from{background-position:50% 0%}to{background-position:50% 100%}}
.bgimg{animation:bgz linear both;animation-timeline:scroll(root)}
.bar{position:fixed;top:0;left:0;right:0;height:4px;background:#FF5A1F;z-index:5;transform-origin:0 50%;animation:prog linear both;animation-timeline:scroll(root)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
  </helmet>
<div aria-hidden="true" style="inset: 0; z-index: -1; pointer-events: none; position: absolute; left: 0px; top: 0px; right: auto; bottom: auto; margin: 0px; box-sizing: border-box; width: 1425px;">
<div class="fl" style="width:200px;height:200px;border:2px solid #FF5A1F;border-radius:50%;top:140px;right:6%;opacity:.35"></div>
<div class="fl" style="width:120px;height:68px;border:2px solid #3A3F4B;border-radius:10px;top:700px;left:4%;animation-duration:11s;animation-direction:reverse"></div>
<main style="max-width: 760px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-direction: column; gap: 28px">
<div style="color:#FF5A1F;font-size:14px;font-weight:500;letter-spacing:.16em">JOIN THE ROSTER</div>
<h1 style="margin:0;font-size:56px;line-height:1.05;font-weight:700;letter-spacing:-.02em">Apply to Creators Zone</h1>
<p style="margin:0;border:1px solid #FF5A1F;border-radius:16px;padding:20px 24px;line-height:1.5">Apply only if you are genuinely interested in this work. Share only your own, fully edited final work. Applications with unedited footage or copied work will not be considered.</p>
<form action="https://formsubmit.co/deepakframes369@gmail.com" method="POST" enctype="multipart/form-data" target="_blank" style="background:#181B22;border:1px solid #262A33;border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:24px">
<input type="hidden" name="_subject" value="New Creators Zone application">
<input type="hidden" name="_template" value="table">
<fieldset class="f"><legend style="padding:0;margin-bottom:8px;font-weight:500">I am a</legend>
<div class="o"><input class="r" type="radio" name="role" value="Editor" required="" id="r1"><label for="r1">Editor</label><input class="r" type="radio" name="role" value="Videographer" id="r2"><label for="r2">Videographer</label><input class="r" type="radio" name="role" value="Photographer" id="r3"><label for="r3">Photographer</label><input class="r" type="radio" name="role" value="Studio" id="r4"><label for="r4">Studio</label></div>
</fieldset>
<label class="f">Studio name (studios only)<input type="text" name="studio_name" placeholder="Your studio name"></label>
<div class="g"><label class="f">Full name<input type="text" name="name" required="" placeholder="Your name"></label><label class="f">Age<input type="number" name="age" required="" placeholder="Your age"></label></div>
<div class="g"><label class="f">Phone / WhatsApp<input type="tel" name="phone" required="" placeholder="+91"></label><label class="f">Email<input type="email" name="email" required="" placeholder="you@email.com"></label></div>
<div class="g"><label class="f">Device you use<input type="text" name="device" placeholder="e.g. laptop, phone, camera"></label><label class="f">Accessories you have<input type="text" name="accessories" placeholder="e.g. gimbal, tripod, mic, lights"></label></div>
<fieldset class="f"><legend style="padding:0;margin-bottom:8px;font-weight:500">Type of edits (editors)</legend>
<div class="o"><input class="r" type="checkbox" name="edit_types" value="Reels" id="e1"><label for="e1">Reels</label><input class="r" type="checkbox" name="edit_types" value="Motion graphics" id="e2"><label for="e2">Motion graphics</label><input class="r" type="checkbox" name="edit_types" value="Cinematic cuts" id="e3"><label for="e3">Cinematic cuts</label><input class="r" type="checkbox" name="edit_types" value="Color grading" id="e4"><label for="e4">Color grading</label><input class="r" type="checkbox" name="edit_types" value="YouTube / podcast" id="e5"><label for="e5">YouTube / podcast</label><input class="r" type="checkbox" name="edit_types" value="Other" id="e6"><label for="e6">Other</label></div>
</fieldset>
<label class="f">Recent photo of you<input type="file" name="photo" accept="image/*" required=""><span style="color:#A9ABB3;font-size:14px;font-weight:400">A clear, recent photo with your face visible, so we can recognise you.</span></label>
<label class="f">Final portfolio or related link<input type="url" name="portfolio_link" required="" placeholder="Link to your best finished work"></label>
<button type="submit" style="align-self:flex-start;background:#FF5A1F;color:#0F1115;border:0;padding:16px 28px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer">Submit application</button>
<p style="margin:0;color:#A9ABB3;font-size:14px">We review every application within working days.</p>
</form>
</main></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
